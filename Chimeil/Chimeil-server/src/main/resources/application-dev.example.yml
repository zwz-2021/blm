# Copy this file to application-dev.yml for local development, or provide the
# same values through environment variables in test and deployment pipelines.
# Do not commit real database, Redis, OSS, or WeChat Pay credentials.

chimeil:
  datasource:
    driver-class-name: ${CHIMEIL_DATASOURCE_DRIVER_CLASS_NAME:com.mysql.cj.jdbc.Driver}
    host: ${CHIMEIL_DATASOURCE_HOST:127.0.0.1}
    port: ${CHIMEIL_DATASOURCE_PORT:3306}
    database: ${CHIMEIL_DATASOURCE_DATABASE:chimeil_dev}
    username: ${CHIMEIL_DATASOURCE_USERNAME:chimeil}
    password: ${CHIMEIL_DATASOURCE_PASSWORD:}

  alioss:
    endpoint: ${CHIMEIL_ALIOSS_ENDPOINT:oss-cn-example.aliyuncs.com}
    access-key-id: ${CHIMEIL_ALIOSS_ACCESS_KEY_ID:your-access-key-id}
    access-key-secret: ${CHIMEIL_ALIOSS_ACCESS_KEY_SECRET:your-access-key-secret}
    bucket-name: ${CHIMEIL_ALIOSS_BUCKET_NAME:your-bucket-name}

  redis:
    host: ${CHIMEIL_REDIS_HOST:127.0.0.1}
    port: ${CHIMEIL_REDIS_PORT:6379}
    password: ${CHIMEIL_REDIS_PASSWORD:}
    database: ${CHIMEIL_REDIS_DATABASE:0}

  wechat:
    appid: ${CHIMEIL_WECHAT_APPID:your-wechat-appid}
    secret: ${CHIMEIL_WECHAT_SECRET:your-wechat-secret}
    mchid: ${CHIMEIL_WECHAT_MCHID:your-merchant-id}
    mchSerialNo: ${CHIMEIL_WECHAT_MCH_SERIAL_NO:your-merchant-cert-serial-no}
    privateKeyFilePath: ${CHIMEIL_WECHAT_PRIVATE_KEY_FILE_PATH:./config/wechat/apiclient_key.pem}
    apiV3Key: ${CHIMEIL_WECHAT_API_V3_KEY:your-api-v3-key}
    weChatPayCertFilePath: ${CHIMEIL_WECHAT_PAY_CERT_FILE_PATH:./config/wechat/wechatpay_cert.pem}
    notifyUrl: ${CHIMEIL_WECHAT_NOTIFY_URL:http://localhost:8080/notify/paySuccess}
    refundNotifyUrl: ${CHIMEIL_WECHAT_REFUND_NOTIFY_URL:http://localhost:8080/notify/refundSuccess}
